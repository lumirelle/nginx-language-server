[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nginx-language-server"
version = "0.11.0"
description = "A language server for nginx.conf"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sam Roeca", email = "samuel.roeca@gmail.com" }]
maintainers = [
  { name = "Walber Vaz da Silva", email = "wvs.walber@gmail.com" },
  { name = "Lumirelle", email = "lumirelle@outlook.com" },
]
keywords = [
  "nginx",
  "completion",
  "refactoring",
  "vim",
  "neovim",
  "lsp",
  "language-server-protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors :: Integrated Development Environments (IDE)",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "lsprotocol>=2025.0.0",
  "pygls>=2.1,<3",
]

[project.scripts]
nginx-language-server = "nginx_language_server.cli:cli"

[project.urls]
Homepage = "https://github.com/lumirelle/nginx-language-server"
Repository = "https://github.com/lumirelle/nginx-language-server"
Changelog = "https://github.com/lumirelle/nginx-language-server/blob/main/CHANGELOG.md"
Issues = "https://github.com/lumirelle/nginx-language-server/issues"

[dependency-groups]
dev = [
  "beautifulsoup4>=4.15.0",
  "pyright>=1.1.392",
  "pytest>=8.3",
  "ruff>=0.15",
]

[tool.hatch.build.targets.sdist]
include = [
  "nginx_language_server",
  "tests",
  "CHANGELOG.md",
  "README.md",
  "README.pt-BR.md",
  "LICENSE",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "D",   # pydocstyle
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "PLR2004", # magic values are fine in a data-driven server
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.pyright]
include = ["nginx_language_server", "scripts", "tests"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
